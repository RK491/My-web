<!DOCTYPE html>

    <title>My Personal Bio</title>
    <link rel="stylesheet" href="css/style.css">

    <div class="container">
        <!-- Profile Section -->

        <!-- Links Section -->

            <!-- Dynamic buttons will be injected here -->
        </main>

        <footer>
            <a href="/admin" class="admin-link">Admin Login</a>
        </footer>
    </div>
